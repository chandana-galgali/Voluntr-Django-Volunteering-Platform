services:
  - type: web
    name: voluntr-django
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations core && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_demo && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: '0'
      - key: DATABASE_URL
        fromDatabase:
          name: voluntr-db
          property: connectionString
databases:
  - name: voluntr-db
