{% if steps_done < steps|length %}<div class="box steps-box"><div class="steps-head"><div><h2>Finish setting up</h2><p class="item-sub">{{ steps_done }} of {{ steps|length }} done — complete these to get the most out of Voluntr.</p></div><div class="progress" aria-hidden="true"><span style="width:{% widthratio steps_done steps|length 100 %}%"></span></div></div><ul class="checklist steps-list">{% for label,done,url in steps %}<li class="{% if done %}done{% endif %}"><span class="tick">✓</span>{% if done %}{{ label }}{% else %}<a href="{{ url }}">{{ label }} →</a>{% endif %}</li>{% endfor %}</ul></div>{% endif %}
