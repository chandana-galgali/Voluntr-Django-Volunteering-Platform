<div class="box"><div class="box-head"><h2>Recent updates</h2><a href="{% url 'notifications' %}">All →</a></div>{% if recent_notes %}<div class="box-body">{% for n in recent_notes %}<div class="item"><div class="item-main"><a class="item-title" style="white-space:normal;font-weight:{% if n.read %}500{% else %}700{% endif %}" href="{% url 'open_notification' n.pk %}">{{ n.text }}</a><div class="item-sub">{{ n.created|timesince }} ago</div></div>{% if not n.read %}<span class="pill pill-pending">New</span>{% endif %}</div>{% endfor %}</div>{% else %}<div class="box-empty"><p>You're all caught up.</p></div>{% endif %}</div>
