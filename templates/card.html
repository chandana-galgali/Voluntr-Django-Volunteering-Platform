{% load static visuals %}<article class="card"><a href="{% url 'detail' o.slug %}"><img loading="lazy" decoding="async" width="1600" height="900" src="{% static o.image|photo_path %}" alt="{{ o.category }} volunteering"></a><div class="cardbody"><div class="meta"><span class="tag">{{ o.category }}</span>{% if o.demo %}<span>Demo listing</span>{% endif %}</div><h3><a href="{% url 'detail' o.slug %}">{{ o.title }}</a></h3><p class="sub">{{ o.organization }} · {{ o.city }}</p><p>{{ o.summary }}</p><div class="cardfoot"><span>{{ o.mode }} · {{ o.commitment }}</span><a href="{% url 'detail' o.slug %}" aria-label="View {{ o.title }}">↗</a></div></div></article>
