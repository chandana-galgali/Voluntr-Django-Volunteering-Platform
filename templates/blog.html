{% extends 'base.html' %}{% block content %}<section class="pagehead"><div class="wrap"><span class="eyebrow">THE JOURNAL</span><h1>Good ideas travel far.</h1><p class="lead">Practical guides, reflections and resources for community-minded people.</p></div></section><section class="wrap section"><form method="get" class="panel"><label for="q">Search journal</label><input id="q" name="q" value="{{ request.GET.q }}"><label for="category">Topic</label><select id="category" name="category"><option value="">All topics</option>{% for c in categories %}<option {% if request.GET.category == c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select><button class="btn">Search</button></form></section><section class="wrap section cards">{% for article in articles %}{% include 'articlecard.html' %}{% empty %}<p>Stories coming soon.</p>{% endfor %}</section>{% endblock %}
